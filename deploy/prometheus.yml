global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          host_id: "rtx-3070"
          rtx_gpu: "true"

  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          host_id: "rtx-3070"
          rtx_gpu: "true"

  - job_name: gpu-exporter
    scrape_interval: 10s
    static_configs:
      - targets: ["127.0.0.1:9835"]
        labels:
          host_id: "rtx-3070"
          rtx_gpu: "true"

  - job_name: harness-tokens
    scrape_interval: 120s
    scrape_timeout: 30s
    static_configs:
      - targets: ["127.0.0.1:9257"]
        labels:
          host_id: "rtx-3070"

  - job_name: claude-code
    scrape_interval: 30s
    static_configs:
      - targets: ["127.0.0.1:9464"]
        labels:
          host_id: "rtx-3070"
