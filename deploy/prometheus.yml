global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # --- per-node GPU stack, one file per exporter (file_sd) ---
  # Add/remove a node by editing targets/vllm.yml, targets/node-exporter.yml,
  # and targets/gpu-exporter.yml. Each entry carries host_id (legend label) +
  # rtx_gpu="true" (scopes the GPU panels).
  - job_name: vllm
    metrics_path: /metrics
    file_sd_configs:
      - files: ["targets/vllm.yml"]
        refresh_interval: 1m

  - job_name: node-exporter
    file_sd_configs:
      - files: ["targets/node-exporter.yml"]
        refresh_interval: 1m

  - job_name: gpu-exporter
    scrape_interval: 10s
    file_sd_configs:
      - files: ["targets/gpu-exporter.yml"]
        refresh_interval: 1m

  # --- WSL-local services (single instance on the monitoring host) ---
  - job_name: harness-tokens
    scrape_interval: 120s
    scrape_timeout: 30s
    static_configs:
      - targets: ["127.0.0.1:9257"]
        labels:
          host_id: "rtx-3070"

  - job_name: claude-code
    scrape_interval: 30s
    static_configs:
      - targets: ["127.0.0.1:9464"]
        labels:
          host_id: "rtx-3070"
