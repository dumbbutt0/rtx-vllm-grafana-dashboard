apiVersion: 1

providers:
  - name: RTX vLLM
    orgId: 1
    folder: RTX
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # __HOME__ is substituted by deploy/install.sh at install time.
      path: __HOME__/opt/grafana-current/conf/provisioning/dashboards
